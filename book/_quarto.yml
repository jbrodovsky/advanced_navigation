format:
  html:
    theme:
      light: cosmo
      dark: darkly
    code-fold: false  # plotting cells opt in with `#| code-fold: true`
    toc: true
    math: true
  pdf:
    pdf-engine: lualatex
    # Latin Modern lacks the Greek letters and symbols used in prose and code
    # (σ, τ, ≤, ℓ, superscript minus, bold-italic Σ); fall back to DejaVu and Latin Modern
    # Math for those glyphs.
    include-in-header:
      text: |
        \directlua{
          luaotfload.add_fallback("textfallback",
            {"DejaVu Serif:mode=node;", "file:latinmodern-math.otf:mode=node;"})
          luaotfload.add_fallback("monofallback",
            {"DejaVu Sans:mode=node;", "file:latinmodern-math.otf:mode=node;"})
        }
        % \mathbf{\Sigma} etc. must come from the math font, not bold text.
        \unimathsetup{mathbf=sym}
        \setmainfont{Latin Modern Roman}[RawFeature={fallback=textfallback}]
        \setmonofont{DejaVu Sans Mono}[Scale=MatchLowercase, RawFeature={fallback=monofallback}]
    documentclass: scrreprt
    number-sections: true
    colorlinks: false
    toc: true
    toc-depth: 1

