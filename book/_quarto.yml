project:
  type: book
  output-dir: output

# Code cells are executed once on the instructor's machine (with the datasets
# present) and the results are stored in _freeze/, which is committed. Builds
# without the data, such as CI, reuse those stored results. Results are stored
# per format, so re-render both html and pdf after changing a chapter's code.
execute:
  freeze: auto

