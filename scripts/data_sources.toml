# Download sources for the course datasets, read by scripts/fetch_data.py.
#
# All three projects share one public archive, the course data bundle
# adv_nav_data.zip on Google Drive. Each dataset names the folder inside it to
# install with `subdir`; `fetch_data.py all` downloads the bundle once.
#
# Instructor workflow when the bundle changes (see README.md, "Instructor tasks"):
#   1. Upload the new zip to Google Drive, replacing the old file so the link
#      stays the same, and share the FILE (not a folder) as "anyone with the
#      link can view".
#   2. Update `sha256` and `size_bytes` below for every dataset in the bundle
#      (`sha256sum adv_nav_data.zip`, `stat -c %s adv_nav_data.zip`), and
#      `subdir` if the folder names changed.
#
# `provider` may be "auto" (detected from the link), "gdrive", "onedrive", or
# "https" (a direct download link). scripts/package_datasets.py still builds
# single-dataset archives (drone-data.zip, victoria-park.zip) if a dataset ever
# needs its own link.

[datasets.drone-data]
description = "Project 1: quadrotor IMU, AprilTag corner detections, camera images and Vicon truth"
provider = "auto"
url = "https://drive.google.com/file/d/1Rx2NxDNcyMqUBWyMIPeASvCeCK0BIW_h/view?usp=drive_link"
sha256 = "59b51e9ee8e343e238c8bbc89070bdea076f8e9a4ef34c26e0037cd0c5fb0eee"
size_bytes = 1601013485
archive = "adv_nav_data.zip"
subdir = "adv_nav_data/Project1-data"
expected_files = [
    "parameters.txt",
    "studentdata0.mat",
    "studentdata1.mat",
    "studentdata2.mat",
    "studentdata3.mat",
    "studentdata4.mat",
    "studentdata5.mat",
    "studentdata6.mat",
    "studentdata7.mat",
]
issue = 1
credit = "Provenance and redistribution terms to be confirmed (GitHub issue #3)."

[datasets.victoria-park]
description = "Project 2: Victoria Park laser, odometry and GPS logs"
provider = "auto"
url = "https://drive.google.com/file/d/1Rx2NxDNcyMqUBWyMIPeASvCeCK0BIW_h/view?usp=drive_link"
sha256 = "59b51e9ee8e343e238c8bbc89070bdea076f8e9a4ef34c26e0037cd0c5fb0eee"
size_bytes = 1601013485
archive = "adv_nav_data.zip"
subdir = "adv_nav_data/Project2-data"
expected_files = ["aa3_lsr2.mat", "aa3_dr.mat", "aa3_gpsx.mat", "info.txt"]
issue = 2
credit = "Victoria Park dataset: J. Guivant and E. Nebot, Australian Centre for Field Robotics, University of Sydney."

[datasets.mems-nav-dataset]
description = "Project 3: smartphone MEMS IMU and GNSS drives at 10 Hz with a reference (truth) solution"
provider = "auto"
url = "https://drive.google.com/file/d/1Rx2NxDNcyMqUBWyMIPeASvCeCK0BIW_h/view?usp=drive_link"
sha256 = "59b51e9ee8e343e238c8bbc89070bdea076f8e9a4ef34c26e0037cd0c5fb0eee"
size_bytes = 1601013485
archive = "adv_nav_data.zip"
subdir = "adv_nav_data/Project3-data"
expected_files = ["input", "truth"]
issue = 1
credit = "MEMS navigation dataset: J. Brodovsky (https://github.com/jbrodovsky/mems-nav-dataset)."
