[project]
name = "advanced-navigation-workspace"
version = "0.1.0"
description = "Course notes and starter workspace for advanced navigation projects."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "notebook>=7.6.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "quarto>=0.1.0",
    "scipy>=1.17.1",
]

[tool.uv.workspace]
members = [
    "projects/drone_pipeline",
    "projects/victoria_park_slam",
    "projects/ins_gnss",
]
