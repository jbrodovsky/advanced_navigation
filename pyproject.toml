[project]
name = "advanced-robot-navigation"
version = "0.1.0"
description = "Course notes and project starter workspace for Advanced Robot Navigation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "drone-pipeline",
    "victoria-park-slam",
    "ins-gnss",
    # Executing the book's code cells (Quarto itself is installed separately).
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "notebook>=7.6.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "projects/drone_pipeline",
    "projects/victoria_park_slam",
    "projects/ins_gnss",
]

[tool.uv.sources]
drone-pipeline = { workspace = true }
victoria-park-slam = { workspace = true }
ins-gnss = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "projects/drone_pipeline/tests",
    "projects/victoria_park_slam/tests",
    "projects/ins_gnss/tests",
]
addopts = ["-ra", "--import-mode=importlib"]
