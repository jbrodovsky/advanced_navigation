[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ins-gnss"
version = "0.1.0"
description = "Starter package for the INS/GNSS integration assignment."
readme = "../../README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ins_gnss"]

