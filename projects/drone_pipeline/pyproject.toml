[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-pipeline"
version = "0.1.0"
description = "Starter package for the visual-inertial drone pipeline project."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "scipy>=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drone_pipeline"]
