[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victoria-park-slam"
version = "0.1.0"
description = "Starter package for the Victoria Park FastSLAM assignment."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
victoria-park-slam = "victoria_park_slam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/victoria_park_slam"]
